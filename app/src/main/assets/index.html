<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Munnaf App</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #080b16;
    color: white;
    font-family: Arial, sans-serif;
}

.card {
    width: 90%;
    max-width: 400px;
    padding: 30px;
    text-align: center;
    border-radius: 24px;
    background: #151a2b;
    box-shadow: 0 0 30px #4338ca55;
}

button {
    padding: 12px 24px;
    border: 0;
    border-radius: 12px;
    background: #7c3aed;
    color: white;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="card">
    <h1>Welcome Munnaf!</h1>
    <p>Your HTML App is running.</p>
    <button onclick="hello()">Click Me</button>
    <p id="message"></p>
</div>

<script>
function hello() {
    document.getElementById("message").innerText =
        "APK is working successfully!";
}
</script>

</body>
  </html>
